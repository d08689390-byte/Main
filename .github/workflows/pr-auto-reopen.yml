name: Auto Reopen Fixed PR

on:
  pull_request:
    types: [edited, synchronize]

jobs:
  validate-template:
    runs-on: ubuntu-latest
    outputs:
      template_valid: ${{ steps.validate.outputs.template_valid }}

    steps:
      - name: Validate PR body again
        id: validate
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.pull_request.body || "";
            const requiredSections = [
              "Pull Request Summary",
              "TL;DR",
              "What Changed?",
              "Why This Change?",
              "How to Test",
              "Screenshots / Demo",
              "Breaking Changes",
              "Type of Change",
              "Additional Notes"
            ];

            const missing = requiredSections.filter(section => !body.includes(section));

            if (missing.length > 0) {
              core.setOutput("template_valid", "false");
              core.setFailed("Still missing required sections.");
            } else {
              core.setOutput("template_valid", "true");
              core.notice("Template now valid.");
            }

  reopen:
    needs: validate-template
    if: needs.validate-template.outputs.template_valid == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Reopen PR if valid
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;

            if (pr.state === "closed") {
              await github.rest.pulls.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pr.number,
                state: "open"
              });

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                body: `
🔄 **Your pull request has been automatically reopened.**

The PR template is now valid.  
Running tests now…`
              });
            }

  run-tests:
    needs: reopen
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test
